<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Practice I — Practice Test</title>
<style>
:root {
  --navy:#12304a; --blue:#1f6f9f; --light:#eef5f8; --gold:#d39a2c;
  --green:#dff4e5; --green-border:#2e8b57; --red:#fde2e2; --red-border:#c53b3b;
  --ink:#1f2933; --muted:#607080; --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f9;color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:34px 20px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(1.8rem,4vw,2.8rem)} header p{margin:0;opacity:.92}
.container{max-width:1050px;margin:0 auto;padding:22px}
.panel{background:white;border-radius:14px;padding:22px;box-shadow:0 5px 18px rgba(0,0,0,.08);margin-bottom:20px}
.start-grid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
label{font-weight:700;display:block;margin-bottom:6px}
select,button{font:inherit} select{width:100%;padding:11px;border:1px solid #b9c6cf;border-radius:8px;background:white}
button{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white} .secondary{background:#e4edf2;color:var(--navy)} .gold{background:var(--gold);color:#17202a}
button:hover{filter:brightness(.96)} button:disabled{opacity:.55;cursor:not-allowed}
#testArea{display:none}
.toolbar{position:sticky;top:0;z-index:5;background:#f4f7f9;padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{font-weight:700;color:var(--navy);margin-left:auto}
.week-heading{margin:28px 0 12px;background:var(--navy);color:white;padding:12px 16px;border-radius:9px;font-size:1.25rem}
.question{background:white;border-radius:12px;padding:20px;margin:0 0 16px;box-shadow:0 3px 12px rgba(0,0,0,.07);border-left:5px solid var(--blue)}
.qnum{font-weight:800;color:var(--blue);margin-bottom:8px} .qtext{font-size:1.08rem;font-weight:700;margin-bottom:14px}
.option{display:block;border:1px solid #cbd6dd;border-radius:9px;padding:11px 12px;margin:8px 0;cursor:pointer;background:#fff}
.option:hover{background:#f6fafc} .option input{margin-right:9px}
.option.correct{background:var(--green);border:2px solid var(--green-border)} .option.incorrect{background:var(--red);border:2px solid var(--red-border)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rationale{display:none;margin-top:12px;padding:12px;border-radius:8px;background:#f1f6f9;border-left:4px solid var(--blue)}
.result{display:none} .score-big{font-size:2.2rem;font-weight:800;color:var(--navy)}
.topic-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid #e4eaee}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8f1f6;color:var(--navy);font-size:.84rem;margin-left:7px}
@media(max-width:650px){.start-grid{grid-template-columns:1fr}.progress{width:100%;margin-left:0}}
</style>
</head>
<body>
<header>
<h1>Professional Practice I — Practice Test</h1>
<p>100 scenario-based questions with balanced, closely related clinical distractors</p>
</header>
<div class="container">
<section id="start" class="panel">
<h2>Choose a section</h2>
<p>Select one week for focused practice, or complete the full 100-question test.</p>
<div class="start-grid">
<div>
<label for="weekSelect">Week or unit</label>
<select id="weekSelect"></select>
</div>
<button class="primary" onclick="startSelected()">Start Selected Week</button>
</div>
<div style="margin-top:12px"><button class="gold" onclick="startWhole()">Do the Whole Test</button></div>
</section>

<section id="testArea">
<div class="toolbar">
<button class="secondary" onclick="returnHome()">Choose Another Section</button>
<button class="secondary" onclick="resetCurrent()">Restart</button>
<button class="primary" onclick="finishTest()">Finish & Score</button>
<span class="progress" id="progressText"></span>
</div>
<div id="questions"></div>
</section>

<section id="result" class="panel result">
<h2>Results</h2>
<div class="score-big" id="scoreText"></div>
<p id="scoreMessage"></p>
<h3>Performance by topic</h3>
<div id="topicResults"></div>
<div class="actions" style="margin-top:18px">
<button class="gold" id="retestBtn" onclick="retestMissed()">Retest Missed Questions</button>
<button class="secondary" onclick="returnHome()">Return to Section Menu</button>
</div>
</section>
</div>

<script>
const bank = [{"week": "Week 1: Assessment", "topic": "Assessment data", "q": "Mr. Cheng says, “The oxygen mask makes me feel as though I am suffocating.” The nurse also observes that he is perspiring and gripping the bedrail. Which finding is subjective data?", "options": ["“The oxygen mask makes me feel as though I am suffocating.”", "The client’s hands are gripping the bedrail tightly.", "The client’s forehead is visibly perspiring.", "The nurse counts 28 respirations per minute."], "answer": "“The oxygen mask makes me feel as though I am suffocating.”", "why": "Subjective data are reported by the client; the other findings are directly observed.", "id": 1}, {"week": "Week 1: Assessment", "topic": "Assessment data", "q": "A client reports weakness. The nurse records a temperature of 39 °C, bilateral crackles, trembling hands, and the statement, “Something awful is going to happen.” Which item is objective data?", "options": ["Bilateral crackles heard on auscultation", "The client’s report of weakness", "The client’s fear that something awful will happen", "The client’s report that the mask feels restrictive"], "answer": "Bilateral crackles heard on auscultation", "why": "Crackles are discovered through physical assessment and are objective.", "id": 2}, {"week": "Week 1: Assessment", "topic": "Data sources", "q": "A client with delirium gives inconsistent answers. The spouse describes the client’s normal cognition, and the electronic chart confirms the history. How should the spouse and chart be classified?", "options": ["Secondary sources used to supplement and validate data", "Primary sources because they know the client well", "Objective findings because they are recorded", "Inferences because the client did not provide them"], "answer": "Secondary sources used to supplement and validate data", "why": "The client is the primary source; family and records are secondary sources.", "id": 3}, {"week": "Week 1: Assessment", "topic": "Validation", "q": "A client says, “I am not short of breath,” but has a respiratory rate of 30, nasal flaring, and an oxygen saturation of 88%. What is the nurse’s best next step?", "options": ["Reassess the client and validate the conflicting data before concluding what the problem is", "Accept the measured findings and disregard the client’s statement", "Document both findings and immediately write a final nursing diagnosis", "Ask a family member which finding is more accurate"], "answer": "Reassess the client and validate the conflicting data before concluding what the problem is", "why": "Conflicting cues require validation and further assessment.", "id": 4}, {"week": "Week 1: Assessment", "topic": "Types of assessment", "q": "A newly admitted client has several chronic illnesses and no recent baseline information. Which assessment should the nurse complete first?", "options": ["An initial comprehensive assessment", "A focused assessment centred on the most urgent chronic condition", "An emergency assessment directed toward immediately unstable findings", "A follow-up assessment comparing current findings with an established baseline"], "answer": "An initial comprehensive assessment", "why": "An initial assessment establishes a complete database for planning care.", "id": 5}, {"week": "Week 1: Assessment", "topic": "Types of assessment", "q": "Two hours after an antihypertensive medication, the nurse checks blood pressure, pulse, dizziness, and orthostatic symptoms. What type of assessment is this?", "options": ["A focused assessment directed at a specific concern", "An initial assessment used to establish the full database", "An emergency assessment limited to life-threatening findings", "A comprehensive assessment repeated after every intervention"], "answer": "A focused assessment directed at a specific concern", "why": "A focused assessment targets a particular problem and may be repeated.", "id": 6}, {"week": "Week 1: Assessment", "topic": "Clinical reasoning", "q": "The nurse groups poor intake, dry mucous membranes, dark urine, and postural dizziness. Which nursing action is being demonstrated?", "options": ["Clustering related cues to identify a pattern", "Separating subjective data from all objective data", "Evaluating whether the care goal was achieved", "Selecting an intervention before interpreting the data"], "answer": "Clustering related cues to identify a pattern", "why": "Cue clustering supports pattern recognition and diagnosis.", "id": 7}, {"week": "Week 1: Assessment", "topic": "Clinical reasoning", "q": "A nurse records, “Client is uncooperative,” after the client declines a bath. Which revision best corrects the assessment error?", "options": ["“Client stated, ‘I do not want a bath now,’ and turned away when bathing was offered.”", "“Client declined the bath after the nurse explained its purpose and offered assistance.”", "“Client appeared reluctant to participate in morning hygiene and required encouragement.”", "“Client demonstrated limited interest in hygiene care during the morning routine.”"], "answer": "“Client stated, ‘I do not want a bath now,’ and turned away when bathing was offered.”", "why": "Assessment should record observable behaviour and exact statements rather than interpretations.", "id": 8}, {"week": "Week 2: Diagnosis and Planning", "topic": "Nursing diagnosis", "q": "A client has pneumonia, crackles, thick secretions, and difficulty coughing effectively. Which statement is the best nursing diagnosis?", "options": ["Ineffective airway clearance related to retained secretions as evidenced by crackles and weak cough", "Pneumonia related to retained secretions as evidenced by crackles", "Impaired gas exchange related to pneumonia as evidenced by antibiotic therapy", "Risk for ineffective airway clearance related to crackles as evidenced by thick secretions"], "answer": "Ineffective airway clearance related to retained secretions as evidenced by crackles and weak cough", "why": "The correct statement identifies a nursing problem, a related cause, and defining characteristics.", "id": 9}, {"week": "Week 2: Diagnosis and Planning", "topic": "Actual vs risk diagnosis", "q": "A client has an unsteady gait and three falls at home but has not fallen in hospital. Which diagnosis is most accurate?", "options": ["Risk for falls related to unsteady gait and history of falls", "Impaired physical mobility related to falls as evidenced by no hospital falls", "Actual falls related to unsafe footwear as evidenced by unsteady gait", "Risk for injury related to a fall that occurred during hospitalization"], "answer": "Risk for falls related to unsteady gait and history of falls", "why": "The problem is a current risk; risk diagnoses do not require defining characteristics.", "id": 10}, {"week": "Week 2: Diagnosis and Planning", "topic": "Diagnosis structure", "q": "Which statement correctly identifies the etiology in “Impaired skin integrity related to frequent liquid stools as evidenced by excoriated perianal skin”?", "options": ["Frequent liquid stools", "Impaired skin integrity", "Excoriated perianal skin", "The client’s gastroenteritis"], "answer": "Frequent liquid stools", "why": "The etiology follows “related to” and guides interventions.", "id": 11}, {"week": "Week 2: Diagnosis and Planning", "topic": "Nursing vs medical", "q": "A client has gastroenteritis, nausea, poor intake, and dark concentrated urine. Which problem is within independent nursing scope to diagnose and manage?", "options": ["Risk for deficient fluid volume related to nausea and diarrhea", "Gastroenteritis requiring confirmation of the medical diagnosis", "Bacterial infection requiring selection of an antibiotic", "Electrolyte disorder requiring a medical diagnosis"], "answer": "Risk for deficient fluid volume related to nausea and diarrhea", "why": "The nursing diagnosis addresses a human response that nurses can assess and manage.", "id": 12}, {"week": "Week 2: Diagnosis and Planning", "topic": "Collaborative problem", "q": "A client develops chest pain and new ECG changes. Nursing monitoring and urgent medical treatment are both required. How should the problem be viewed?", "options": ["A collaborative problem requiring nursing and medical interventions", "An independent nursing diagnosis managed without medical input", "A medical diagnosis that requires no nursing judgement", "A risk diagnosis because the client has not yet reported pain"], "answer": "A collaborative problem requiring nursing and medical interventions", "why": "Collaborative problems require combined expertise and interventions.", "id": 13}, {"week": "Week 2: Diagnosis and Planning", "topic": "SMART goals", "q": "Which goal best fits a client with an unsteady gait?", "options": ["By 1600 today, the client will walk 20 metres with a walker and one assist without loss of balance", "By the end of the shift, the client will transfer from bed to chair using a walker with one assist", "Within 24 hours, the client will ambulate safely in the hallway using the prescribed mobility aid", "Before discharge, the client will demonstrate correct walker use during three observed transfers"], "answer": "By 1600 today, the client will walk 20 metres with a walker and one assist without loss of balance", "why": "It is client-centred, specific, measurable, and time limited.", "id": 14}, {"week": "Week 2: Diagnosis and Planning", "topic": "SMART goals", "q": "The goal reads, “The client will understand fall prevention before discharge.” Which revision makes it most measurable?", "options": ["Before discharge, the client will identify three personal fall risks and demonstrate correct call-bell use", "Before discharge, the client will explain two reasons for requesting assistance before standing", "By 1600, the client will demonstrate correct use of nonslip footwear and the walker", "Before the end of teaching, the client will describe the steps used to reduce fall risk at home"], "answer": "Before discharge, the client will identify three personal fall risks and demonstrate correct call-bell use", "why": "The revised goal contains observable client behaviours and a timeframe.", "id": 15}, {"week": "Week 2: Diagnosis and Planning", "topic": "Prioritization", "q": "A client has anxiety about discharge, a reddened heel, constipation for two days, and sudden increasing work of breathing. Which nursing problem should be addressed first?", "options": ["The sudden increase in work of breathing", "The reddened heel because skin changes can worsen", "The constipation because it is an actual problem", "The discharge anxiety because the client identifies it as important"], "answer": "The sudden increase in work of breathing", "why": "An acute threat to breathing has the highest priority.", "id": 16}, {"week": "Week 3: Implementation and Evaluation", "topic": "Independent interventions", "q": "A nurse notices that an immobile client’s heels are reddened but intact. Which intervention may the nurse initiate independently?", "options": ["Off-load the heels, reposition the client, and reassess the skin", "Apply a prescription-strength medicated cream without an order", "Order a diagnostic vascular study", "Discontinue all mobility until a physician assesses the client"], "answer": "Off-load the heels, reposition the client, and reassess the skin", "why": "Repositioning, pressure relief, and reassessment are nurse-initiated actions.", "id": 17}, {"week": "Week 3: Implementation and Evaluation", "topic": "Dependent interventions", "q": "A physician prescribes an IV antibiotic. What makes administration a dependent intervention?", "options": ["It requires an authorized order, although the nurse remains accountable for safe administration", "It is initiated by another regulated provider and implemented using nursing judgement", "It is directed toward treatment of a diagnosed condition and requires verification before administration", "It depends on a prescriber’s direction while still requiring nursing assessment and evaluation"], "answer": "It requires an authorized order, although the nurse remains accountable for safe administration", "why": "Dependent interventions require an order; nurses still assess, clarify, implement, and evaluate safely.", "id": 18}, {"week": "Week 3: Implementation and Evaluation", "topic": "Collaborative interventions", "q": "A client needs a mobility plan, equipment assessment, and pain control before discharge. Which plan best represents a collaborative intervention?", "options": ["Nursing, physiotherapy, occupational therapy, the prescriber, and the client jointly coordinate the plan", "The nurse independently selects all equipment and therapies", "Each discipline develops a separate plan without discussing priorities", "The prescriber writes orders and the remaining team follows them without input"], "answer": "Nursing, physiotherapy, occupational therapy, the prescriber, and the client jointly coordinate the plan", "why": "Collaboration combines the knowledge and skills of multiple providers with the client.", "id": 19}, {"week": "Week 3: Implementation and Evaluation", "topic": "Direct and indirect care", "q": "Which action is indirect care performed on behalf of a client?", "options": ["Calling the pharmacist to clarify a medication interaction and updating the care plan", "Reviewing the client’s laboratory trends and communicating concerns to the prescriber", "Coordinating a physiotherapy consultation and documenting the agreed mobility plan", "Delegating morning hygiene to a support worker and later evaluating the care provided"], "answer": "Calling the pharmacist to clarify a medication interaction and updating the care plan", "why": "Coordination and communication away from the bedside are indirect care.", "id": 20}, {"week": "Week 3: Implementation and Evaluation", "topic": "Questioning orders", "q": "A prescribed dose is ten times greater than the usual dose listed in the medication reference. What should the nurse do first?", "options": ["Hold the medication and clarify the order with the prescriber or appropriate pharmacist", "Administer it because the prescriber is responsible for the dose", "Reduce the dose to what the nurse believes is correct", "Ask another nurse to co-sign and then administer it"], "answer": "Hold the medication and clarify the order with the prescriber or appropriate pharmacist", "why": "Nurses must recognize and clarify potentially incorrect orders before implementation.", "id": 21}, {"week": "Week 3: Implementation and Evaluation", "topic": "Selecting interventions", "q": "Two evidence-informed interventions could address the same diagnosis. Which factors should guide the final choice?", "options": ["The diagnosis and goal, evidence, feasibility, client preference, and nurse competence", "The intervention most familiar to the unit regardless of client preference", "The least time-consuming intervention for staff", "The intervention requiring the fewest team members"], "answer": "The diagnosis and goal, evidence, feasibility, client preference, and nurse competence", "why": "Interventions must be appropriate, feasible, acceptable, evidence informed, and within competence.", "id": 22}, {"week": "Week 3: Implementation and Evaluation", "topic": "Evaluation", "q": "A goal states that pain will decrease from 8/10 to 3/10 within one hour. At one hour, pain is 5/10 and the client can deep-breathe more comfortably. How should the nurse evaluate the goal?", "options": ["Partially met; reassess contributing factors and decide whether the plan needs modification", "Met because both pain and function improved", "Not met, so discontinue all current interventions", "Unable to evaluate because the pain did not reach zero"], "answer": "Partially met; reassess contributing factors and decide whether the plan needs modification", "why": "The outcome improved but did not fully meet the stated criterion.", "id": 23}, {"week": "Week 3: Implementation and Evaluation", "topic": "Evaluation", "q": "A client met a mobility goal for two consecutive days. What is the nurse’s best next action?", "options": ["Document the outcome and decide with the client whether to continue, advance, or conclude the plan", "Keep the plan unchanged until discharge", "Remove the diagnosis without documenting the outcome", "Replace the goal with a more difficult one without consulting the client"], "answer": "Document the outcome and decide with the client whether to continue, advance, or conclude the plan", "why": "Evaluation informs continuation, revision, advancement, or completion.", "id": 24}, {"week": "Week 4: Documentation", "topic": "Factual documentation", "q": "Which note best meets the requirement for factual documentation?", "options": ["1430: Client stated, “My incision is burning.” Guarding abdomen; pain 7/10; incision edges approximated, no drainage noted.", "1430: Client appears to have severe pain and is probably developing an infection.", "1430: Client was dramatic about the incision but wound looked fine.", "1430: Client complained again; reassurance provided."], "answer": "1430: Client stated, “My incision is burning.” Guarding abdomen; pain 7/10; incision edges approximated, no drainage noted.", "why": "It includes the client’s exact words and observable, measurable findings without judgement.", "id": 25}, {"week": "Week 4: Documentation", "topic": "Accuracy", "q": "A nurse documents “large emesis.” Which revision is most accurate?", "options": ["“Approximately 300 mL green-brown emesis measured in basin”", "“Significant amount of unpleasant emesis”", "“Client vomited badly after lunch”", "“Moderate emesis, likely from medication”"], "answer": "“Approximately 300 mL green-brown emesis measured in basin”", "why": "Specific measurements and descriptive terms are more accurate than vague or interpretive wording.", "id": 26}, {"week": "Week 4: Documentation", "topic": "Error correction", "q": "A nurse writes the wrong blood pressure in a paper record. Which correction is appropriate?", "options": ["Follow agency policy so the original entry remains readable, then date or initial the correction", "Draw a single line through the incorrect value, enter the correction, and identify the change according to policy", "Mark the entry as an error, add the correct value nearby, and preserve the original documentation", "Use the approved correction method so the record clearly shows both the original and corrected information"], "answer": "Follow agency policy so the original entry remains readable, then date or initial the correction", "why": "The record must preserve the original entry and show a transparent correction.", "id": 27}, {"week": "Week 4: Documentation", "topic": "Late entry", "q": "A nurse realizes at 1800 that care provided at 1500 was not charted. What is the best action?", "options": ["Enter a clearly identified late entry according to policy, using the current time and the actual time of care", "Add a late entry at 1800 that clearly states the care occurred at 1500 and explains the sequence accurately", "Document the omitted care at the current time and label it according to the organization’s late-entry process", "Record the care transparently using the present date and time while identifying when the intervention occurred"], "answer": "Enter a clearly identified late entry according to policy, using the current time and the actual time of care", "why": "Late entries must be transparent and completed according to policy.", "id": 28}, {"week": "Week 4: Documentation", "topic": "Information security", "q": "A nurse leaves a workstation to answer a call. Which action best protects health information?", "options": ["Lock or log out of the record before leaving the workstation", "Turn the monitor slightly away from the hallway", "Ask a colleague to watch the screen", "Leave the chart open if returning within five minutes"], "answer": "Lock or log out of the record before leaving the workstation", "why": "Electronic records must be secured whenever unattended.", "id": 29}, {"week": "Week 4: Documentation", "topic": "Documentation accountability", "q": "A student watches an instructor perform sterile wound care and obtains the post-procedure pain score. What should the student document?", "options": ["The student’s own assessment and any actions personally completed, following site and instructor direction", "The wound-care steps directly observed, clearly attributing performance to the instructor", "The instructor’s procedure and the student’s pain assessment in one combined entry", "The complete procedure if the instructor confirms that the student may document on the instructor’s behalf"], "answer": "The student’s own assessment and any actions personally completed, following site and instructor direction", "why": "Each person documents their own observations and actions within role and policy.", "id": 30}, {"week": "Week 4: Documentation", "topic": "Completeness", "q": "After giving a PRN analgesic, which documentation is most complete?", "options": ["Pre-medication assessment, medication details, time and route, safety actions, and the client’s response at the appropriate interval", "Pain assessment, medication name and dose, administration time, and the client’s response when reassessed", "Reason for the PRN medication, route, relevant precautions, and the client’s later outcome", "Assessment findings before administration, the intervention provided, and evaluation of effectiveness afterward"], "answer": "Pre-medication assessment, medication details, time and route, safety actions, and the client’s response at the appropriate interval", "why": "Complete documentation connects assessment, intervention, and evaluation.", "id": 31}, {"week": "Week 4: Documentation", "topic": "Chronology", "q": "A client’s condition changed several times during the shift. Which approach best supports continuity of care?", "options": ["Document events in chronological order with dates, times, assessments, actions, notifications, and responses", "Create a concise end-of-shift narrative that links each change with the intervention and outcome", "Group the documentation by each identified problem while keeping the sequence of events clear", "Use a focused note for each significant change and include the related assessment, action, and response"], "answer": "Document events in chronological order with dates, times, assessments, actions, notifications, and responses", "why": "Chronological, timely entries show the progression of care and decisions.", "id": 32}, {"week": "Week 5: Reporting and Documentation Systems", "topic": "Transfer of accountability", "q": "During shift report, which information is most important to communicate first?", "options": ["A new drop in oxygen saturation with current interventions and response", "A recent increase in confusion with the safety measures currently in place", "A new episode of chest discomfort with assessment findings and actions taken", "A significant blood-pressure change with symptoms, notifications, and treatment response"], "answer": "A new drop in oxygen saturation with current interventions and response", "why": "Critical current changes and safety concerns take priority.", "id": 33}, {"week": "Week 5: Reporting and Documentation Systems", "topic": "Telephone reporting", "q": "Before calling the MRP about worsening hypotension, which preparation is most appropriate?", "options": ["Review current and previous vital signs, relevant history, medications, labs, code status, and the chart", "Organize the latest assessment findings, recent trends, relevant diagnoses, and current treatment information", "Prepare the client’s baseline data, present concern, medication profile, and available investigation results", "Gather the information needed to explain the change, support the assessment, and answer likely clinical questions"], "answer": "Review current and previous vital signs, relevant history, medications, labs, code status, and the chart", "why": "A concise call still requires complete, current, relevant information.", "id": 34}, {"week": "Week 5: Reporting and Documentation Systems", "topic": "Read-back", "q": "The MRP gives a telephone order for potassium replacement. Which response best reduces error?", "options": ["Write the complete order, read it back verbatim, clarify uncertainties, and document according to policy", "Record the order exactly, confirm the medication, dose, route, and timing, then document the communication", "Repeat the order back in full, resolve unclear details, and complete the required telephone-order record", "Transcribe the order, verify each component with the prescriber, and sign it according to agency procedure"], "answer": "Write the complete order, read it back verbatim, clarify uncertainties, and document according to policy", "why": "Read-back and clarification confirm accuracy.", "id": 35}, {"week": "Week 5: Reporting and Documentation Systems", "topic": "SBAR", "q": "The nurse begins, “I’m calling about Ms. Patel because her oxygen saturation has fallen from 95% to 86% in the past 20 minutes.” Which SBAR component is this?", "options": ["Situation", "Background", "Assessment", "Recommendation"], "answer": "Situation", "why": "Situation identifies the immediate concern and reason for the call.", "id": 36}, {"week": "Week 5: Reporting and Documentation Systems", "topic": "SBAR", "q": "The nurse continues, “She was admitted yesterday with pneumonia, has COPD, and is receiving 2 L/min by nasal cannula.” Which SBAR component is this?", "options": ["Background", "Situation", "Assessment", "Recommendation"], "answer": "Background", "why": "Background provides the relevant clinical context.", "id": 37}, {"week": "Week 5: Reporting and Documentation Systems", "topic": "SBAR", "q": "The nurse says, “Respiratory rate is 30, crackles are increased, and I believe her respiratory status is deteriorating.” Which SBAR component is this?", "options": ["Assessment", "Situation", "Background", "Recommendation"], "answer": "Assessment", "why": "Assessment reports current findings and the nurse’s clinical interpretation.", "id": 38}, {"week": "Week 5: Reporting and Documentation Systems", "topic": "SBAR", "q": "The nurse concludes, “I need you to assess her now and consider increasing oxygen or ordering further respiratory treatment.” Which component is this?", "options": ["Recommendation", "Situation", "Background", "Assessment"], "answer": "Recommendation", "why": "Recommendation states what the nurse believes should happen next.", "id": 39}, {"week": "Week 5: Reporting and Documentation Systems", "topic": "ADPIE vs SOAPIE/FAIR", "q": "A student develops a falls-prevention goal and interventions, then later charts the care and client response. Which pairing is correct?", "options": ["Use ADPIE to organize the plan of care and SOAPIE or FAIR to document what occurred", "Use SOAPIE to organize assessment and planning, then FAIR to document evaluation and response", "Use FAIR to establish the problem list, then ADPIE to record the care delivered during the shift", "Use ADPIE for the nursing diagnosis and SOAPIE for revising the client’s long-term goals"], "answer": "Use ADPIE to organize the plan of care and SOAPIE or FAIR to document what occurred", "why": "ADPIE is the care-planning process; SOAPIE and FAIR are documentation formats.", "id": 40}, {"week": "Week 6: Privacy, Confidentiality and Consent", "topic": "Need-to-know access", "q": "A student notices that a neighbour has been admitted to another unit. What is the most appropriate action?", "options": ["Do not access the record because the student has no professional need to know", "Access the demographic page to confirm that the neighbour is the person admitted", "Ask the assigned nurse whether the admission involves a serious condition", "Review the record briefly but avoid opening laboratory or progress-note sections"], "answer": "Do not access the record because the student has no professional need to know", "why": "Access is permitted only when required to provide care.", "id": 41}, {"week": "Week 6: Privacy, Confidentiality and Consent", "topic": "Circle of care", "q": "A nurse sends relevant wound information to a community nurse who will provide the client’s follow-up care. Which principle supports the disclosure?", "options": ["Sharing within the circle of care for the purpose of providing care", "Public-interest disclosure because the client is leaving hospital", "Implied permission to share with any regulated professional", "Educational use because both people are nurses"], "answer": "Sharing within the circle of care for the purpose of providing care", "why": "PHIPA permits appropriate care-related sharing among involved providers.", "id": 42}, {"week": "Week 6: Privacy, Confidentiality and Consent", "topic": "Confidential conversation", "q": "Two nurses need to discuss a sensitive change in a client’s condition. Which location is most appropriate?", "options": ["A private staff area where unauthorized people cannot hear", "At the nurses’ station using the room number", "In the elevator using initials", "At the bedside while visitors are present"], "answer": "A private staff area where unauthorized people cannot hear", "why": "Privacy requires an appropriate setting, not merely avoiding the client’s name.", "id": 43}, {"week": "Week 6: Privacy, Confidentiality and Consent", "topic": "Disclosure without consent", "q": "A nurse has reasonable grounds to suspect child abuse. Which action is most appropriate?", "options": ["Report the suspicion directly as required by law and follow organizational procedure", "Consult the charge nurse first and delay reporting until the team reaches agreement", "Document the concern and wait for the physician to determine whether a report is warranted", "Ask the caregiver for an explanation before deciding whether the threshold for reporting has been met"], "answer": "Report the suspicion directly as required by law and follow organizational procedure", "why": "Suspected child abuse is a mandatory-reporting circumstance identified in the course.", "id": 44}, {"week": "Week 6: Privacy, Confidentiality and Consent", "topic": "Valid consent", "q": "A client agrees to a procedure after the nurse says, “You have no real choice if you want good care.” Which element of valid consent is most clearly missing?", "options": ["Voluntariness", "Capacity", "Disclosure of the treatment name", "The presence of a witness"], "answer": "Voluntariness", "why": "Consent obtained through pressure or coercion is not voluntary.", "id": 45}, {"week": "Week 6: Privacy, Confidentiality and Consent", "topic": "Capacity", "q": "A client with a psychiatric diagnosis accurately explains the proposed treatment, alternatives, and consequences of refusal. What is the best conclusion?", "options": ["The client may be capable because capacity depends on understanding and appreciation, not diagnosis alone", "The client is likely incapable because psychiatric illness can interfere with treatment decisions", "The family should participate in the decision because the diagnosis creates uncertainty about judgement", "The treatment team should defer the decision until symptoms improve, even though the client explains the consequences"], "answer": "The client may be capable because capacity depends on understanding and appreciation, not diagnosis alone", "why": "Capacity is decision specific and is not determined solely by diagnosis.", "id": 46}, {"week": "Week 6: Privacy, Confidentiality and Consent", "topic": "Implied consent", "q": "After an explanation, a capable client rolls up a sleeve and extends an arm for a blood-pressure measurement. This is best interpreted as:", "options": ["Implied consent through the client’s actions", "Written expressed consent", "Consent from a substitute decision-maker", "Emergency consent"], "answer": "Implied consent through the client’s actions", "why": "The client’s behaviour indicates agreement to the explained routine procedure.", "id": 47}, {"week": "Week 6: Privacy, Confidentiality and Consent", "topic": "Withdrawal of consent", "q": "A capable client initially consents to a dressing change but then says, “Stop. I do not want this continued.” What should the nurse do?", "options": ["Stop the procedure, assess concerns, and respect the withdrawal unless an applicable emergency exception exists", "Pause the procedure, explain the benefits again, and continue if the nurse believes refusal is unsafe", "Finish the current portion of care, then discuss the client’s concerns before the next dressing change", "Ask the substitute decision-maker whether the procedure should continue despite the client’s withdrawal"], "answer": "Stop the procedure, assess concerns, and respect the withdrawal unless an applicable emergency exception exists", "why": "A capable client may withdraw consent.", "id": 48}, {"week": "Week 8: Quality Assurance and Reflective Practice", "topic": "Reflective practice", "q": "After a difficult interaction, a nurse examines personal reactions, the client’s perspective, relevant standards, and what could be done differently. What is this process?", "options": ["Reflective practice used to improve future care", "A factual progress note documenting the client’s condition", "A transfer-of-accountability report", "A disciplinary investigation"], "answer": "Reflective practice used to improve future care", "why": "Reflection deliberately explores meaning, learning, and improvement.", "id": 49}, {"week": "Week 8: Quality Assurance and Reflective Practice", "topic": "QA process", "q": "Which sequence best demonstrates the annual Quality Assurance process?", "options": ["Honest self-assessment, peer feedback, identification of learning needs, learning goals and activities, then evaluation of application", "Self-assessment, selection of a professional standard, completion of a learning activity, and documentation of attendance", "Peer feedback, review of practice concerns, selection of a course, and confirmation that the course was completed", "Identification of a learning need, development of a goal, completion of activities, and submission of the plan to a manager"], "answer": "Honest self-assessment, peer feedback, identification of learning needs, learning goals and activities, then evaluation of application", "why": "The QA process connects reflection, feedback, planning, implementation, and evaluation.", "id": 50}, {"week": "Week 8: Quality Assurance and Reflective Practice", "topic": "Reflective note process", "q": "A student objectively explains what occurred, then examines strengths and errors, considers feedback, and identifies future action. Which sequence is being followed?", "options": ["Describe, Analyze, Evaluate, Plan", "Assess, Diagnose, Plan, Implement", "Focus, Assess, Intervene, Respond", "Situation, Background, Assessment, Recommendation"], "answer": "Describe, Analyze, Evaluate, Plan", "why": "These are the four stages of the reflective-note process.", "id": 51}, {"week": "Week 8: Quality Assurance and Reflective Practice", "topic": "Describe", "q": "Which passage belongs primarily in the Describe section?", "options": ["“During the transfer, I positioned the wheelchair but did not lock the left brake. My instructor stopped the transfer before the client stood.”", "“The unlocked brake increased the risk of movement during the transfer and showed that I skipped a safety step.”", "“My instructor observed that I communicated calmly but needed to verify the equipment setup more carefully.”", "“Before the next lab, I will use the transfer checklist and practise the sequence with a peer.”"], "answer": "“During the transfer, I positioned the wheelchair but did not lock the left brake. My instructor stopped the transfer before the client stood.”", "why": "Describe presents the significant event, facts, role, and observations.", "id": 52}, {"week": "Week 8: Quality Assurance and Reflective Practice", "topic": "Analyze", "q": "Which passage belongs primarily in the Analyze section?", "options": ["“I focused on completing the task and missed a safety step; the transfer checklist indicates both brakes must be locked before standing.”", "“At 0930 in the simulation lab, I prepared the wheelchair and attempted to begin the transfer.”", "“My instructor said my communication was appropriate but my equipment check was incomplete.”", "“I will review the transfer standard and practise the full sequence twice before next week.”"], "answer": "“I focused on completing the task and missed a safety step; the transfer checklist indicates both brakes must be locked before standing.”", "why": "Analyze interprets what was right or wrong, why it occurred, and what evidence supports the conclusion.", "id": 53}, {"week": "Week 8: Quality Assurance and Reflective Practice", "topic": "Evaluate", "q": "Which statement belongs primarily in the Evaluate section of a reflective note?", "options": ["“My instructor said my communication was calm but that I did not verify the client’s readiness before moving.”", "“I attempted the transfer after positioning the wheelchair beside the bed.”", "“I became focused on the task and did not pause to reassess the client’s readiness.”", "“I will use a verbal safety checklist before each transfer in the next two lab sessions.”"], "answer": "“My instructor said my communication was calm but that I did not verify the client’s readiness before moving.”", "why": "Evaluate incorporates feedback from peers, instructors, or clients.", "id": 54}, {"week": "Week 8: Quality Assurance and Reflective Practice", "topic": "Learning-plan goal", "q": "Which learning goal is strongest?", "options": ["By October 30, I will correctly apply the consent standard to four new case scenarios with at least 90% accuracy", "By October 30, I will summarize the major consent principles in my own words and review them with a peer", "Before the final exam, I will complete four consent case studies and compare my answers with the course material", "Over the next four weeks, I will review one consent concept weekly and record questions for my instructor"], "answer": "By October 30, I will correctly apply the consent standard to four new case scenarios with at least 90% accuracy", "why": "The goal is specific, measurable, relevant, and time limited.", "id": 55}, {"week": "Week 8: Quality Assurance and Reflective Practice", "topic": "Learning activities", "q": "Which activity best supports a goal about writing SMART nursing goals?", "options": ["Each week for three weeks, rewrite two case-study goals using the SMART criteria and obtain peer feedback", "Review six completed SMART goals from the course materials and identify the criteria used in each one", "Create one SMART goal from a new case study each week and compare it with an instructor-provided example", "Complete a worksheet on SMART criteria and discuss two difficult examples with a study partner"], "answer": "Each week for three weeks, rewrite two case-study goals using the SMART criteria and obtain peer feedback", "why": "A strong learning activity is specific, active, scheduled, and connected to the goal.", "id": 56}, {"week": "Week 9: Therapeutic Nurse-Client Relationship", "topic": "Trust", "q": "A nurse promised to return with pain medication in 15 minutes but is delayed by an emergency. What response best protects trust?", "options": ["Inform the client of the delay, apologize, explain briefly, and follow through as soon as possible", "Ask a colleague to tell the client that the medication will be delayed and return when available", "Return with the medication when possible and explain that an emergency required immediate attention", "Update the client about the delay, arrange alternate support if needed, and ensure the promise is ultimately completed"], "answer": "Inform the client of the delay, apologize, explain briefly, and follow through as soon as possible", "why": "Honesty and follow-through help preserve fragile trust.", "id": 57}, {"week": "Week 9: Therapeutic Nurse-Client Relationship", "topic": "Respect", "q": "A client’s cultural health practice differs from the nurse’s beliefs but is not unsafe. What should the nurse do?", "options": ["Explore and support the client’s preference without judgement and incorporate it where possible", "Acknowledge the preference, explain the usual nursing approach, and ask the client to choose between the two", "Respect the practice privately but use the standard care plan to maintain consistency across clients", "Discuss the practice with the team and incorporate it after confirming that other providers agree"], "answer": "Explore and support the client’s preference without judgement and incorporate it where possible", "why": "Respect recognizes dignity, individuality, culture, and choice.", "id": 58}, {"week": "Week 9: Therapeutic Nurse-Client Relationship", "topic": "Empathy", "q": "A client says, “I am afraid I will never be independent again.” Which response best demonstrates empathy?", "options": ["“Losing independence feels frightening to you. Tell me what concerns you most.”", "“I know exactly how you feel because I was injured once.”", "“You should stay positive; rehabilitation usually works.”", "“At least you have family to help you.”"], "answer": "“Losing independence feels frightening to you. Tell me what concerns you most.”", "why": "Empathy validates meaning while keeping the focus on the client.", "id": 59}, {"week": "Week 9: Therapeutic Nurse-Client Relationship", "topic": "Professional intimacy", "q": "During personal care, a client shares deeply private fears and relies on the nurse for physical assistance. Which concept is most relevant?", "options": ["Professional intimacy", "Social reciprocity", "Equal power", "Personal friendship"], "answer": "Professional intimacy", "why": "Nursing care creates physical, psychological, social, and spiritual closeness.", "id": 60}, {"week": "Week 9: Therapeutic Nurse-Client Relationship", "topic": "Power", "q": "A nurse threatens to delay pain medication unless a client agrees to bathe. Which principle is being violated?", "options": ["The nurse is misusing professional power", "The nurse is using appropriate limit setting", "The nurse is maintaining professional intimacy", "The nurse is supporting client-centred care"], "answer": "The nurse is misusing professional power", "why": "Using authority or access to care to pressure a client is an abuse of power.", "id": 61}, {"week": "Week 9: Therapeutic Nurse-Client Relationship", "topic": "Gifts", "q": "At discharge, a client offers one nurse a costly necklace. Which response is best?", "options": ["Thank the client, explain professional boundaries, and decline after considering intent, value, timing, and impact", "Accept the necklace if the client clearly states that no future favour or special treatment is expected", "Ask the manager whether the gift may be accepted and shared with the entire team", "Suggest that the client donate the necklace to the unit so no single nurse receives a personal benefit"], "answer": "Thank the client, explain professional boundaries, and decline after considering intent, value, timing, and impact", "why": "Individual gifts are generally declined; risk and relationship impact must be assessed.", "id": 62}, {"week": "Week 9: Therapeutic Nurse-Client Relationship", "topic": "Technology boundaries", "q": "A current client sends a personal social-media request to the nurse. What is the best response?", "options": ["Do not accept; maintain professional communication through approved channels", "Accept but avoid posting about health care", "Accept because the client initiated the request", "Create a second private account for clients"], "answer": "Do not accept; maintain professional communication through approved channels", "why": "Technology must be used for therapeutic, professional purposes while protecting boundaries.", "id": 63}, {"week": "Week 9: Therapeutic Nurse-Client Relationship", "topic": "Protection from abuse", "q": "A student sees a staff member roughly restrain and insult a client. What should the student do?", "options": ["Act to protect immediate safety and report the behaviour promptly according to policy", "Intervene to stop the behaviour, then discuss the incident privately with the staff member before deciding whether to report", "Ensure the client is safe, document objective findings, and wait for the instructor to determine whether reporting is required", "Remove the client from the situation and ask another witness to confirm what occurred before taking further action"], "answer": "Act to protect immediate safety and report the behaviour promptly according to policy", "why": "Nurses must intervene and report suspected abuse.", "id": 64}, {"week": "Week 10: Therapeutic Communication", "topic": "Intrapersonal communication", "q": "Before meeting a client, the nurse notices feeling impatient and deliberately reframes those thoughts. Which level of communication is occurring?", "options": ["Intrapersonal communication", "Interpersonal communication", "Small-group communication", "Public communication"], "answer": "Intrapersonal communication", "why": "Intrapersonal communication is internal self-talk and reflection.", "id": 65}, {"week": "Week 10: Therapeutic Communication", "topic": "Interpersonal communication", "q": "A nurse and client discuss the client’s goals for discharge in a private room. Which level is this?", "options": ["Interpersonal communication", "Intrapersonal communication", "Small-group communication", "Organizational communication"], "answer": "Interpersonal communication", "why": "Interpersonal communication occurs between two people.", "id": 66}, {"week": "Week 10: Therapeutic Communication", "topic": "Congruence", "q": "A client says, “I’m not worried,” while wringing both hands and avoiding eye contact. What is the nurse’s best response?", "options": ["“You say you are not worried, but I notice you are wringing your hands. What are you feeling right now?”", "“You seem more anxious than your words suggest. Would you like me to explain the procedure again?”", "“I notice you are avoiding eye contact. Are you concerned about what may happen next?”", "“Your hands appear tense even though you say you are fine. What would help you feel more comfortable?”"], "answer": "“You say you are not worried, but I notice you are wringing your hands. What are you feeling right now?”", "why": "The nurse gently explores incongruence without accusation or reassurance.", "id": 67}, {"week": "Week 10: Therapeutic Communication", "topic": "Open-ended questions", "q": "A client says, “I am terrified about tomorrow’s surgery.” Which response is most therapeutic?", "options": ["“What concerns you most when you think about the surgery?”", "“Are you afraid of the anaesthetic?”", "“You do not need to be frightened.”", "“Most clients feel better after speaking with the surgeon.”"], "answer": "“What concerns you most when you think about the surgery?”", "why": "An open-ended question invites the client to identify the concern.", "id": 68}, {"week": "Week 10: Therapeutic Communication", "topic": "Clarification", "q": "A client says, “Everything is falling apart.” Which response best uses clarification?", "options": ["“When you say everything is falling apart, what specifically has changed for you?”", "“Are you referring mainly to changes in your family relationships?”", "“It sounds as though several problems are happening at once. Which one feels most urgent?”", "“You seem overwhelmed by recent events. Can you tell me when this feeling began?”"], "answer": "“When you say everything is falling apart, what specifically has changed for you?”", "why": "Clarification checks meaning rather than assuming.", "id": 69}, {"week": "Week 10: Therapeutic Communication", "topic": "Reflection", "q": "A client says, “I feel useless because I need help bathing.” Which response best uses reflection?", "options": ["“Needing help with bathing has made you feel useless.”", "“You should not feel that way.”", "“Why would bathing matter so much?”", "“Many clients need assistance.”"], "answer": "“Needing help with bathing has made you feel useless.”", "why": "Reflection restates the feeling or meaning and encourages exploration.", "id": 70}, {"week": "Week 10: Therapeutic Communication", "topic": "Assertiveness", "q": "A student believes a transfer is unsafe because the client is newly dizzy. Which statement is most professionally assertive?", "options": ["“I am concerned the transfer is unsafe because the client is dizzy. I need us to reassess before proceeding.”", "“The client reports dizziness, so I recommend delaying the transfer until the blood pressure is rechecked.”", "“I am not comfortable continuing until we confirm that the client can stand safely.”", "“The new dizziness may increase fall risk; can we pause and complete another assessment first?”"], "answer": "“I am concerned the transfer is unsafe because the client is dizzy. I need us to reassess before proceeding.”", "why": "Assertive communication is clear, respectful, and safety focused.", "id": 71}, {"week": "Week 10: Therapeutic Communication", "topic": "Health literacy", "q": "Which teaching approach best supports a client with limited health literacy?", "options": ["Use plain language, small amounts of information, demonstration, and teach-back", "Use detailed medical terminology to build vocabulary", "Provide a long written handout and avoid repetition", "Speak louder and faster to emphasize key points"], "answer": "Use plain language, small amounts of information, demonstration, and teach-back", "why": "Clarity, pacing, vocabulary, and feedback improve understanding.", "id": 72}, {"week": "Week 10: Therapeutic Communication", "topic": "Language barriers", "q": "A client with limited English nods during teaching but cannot explain the instructions. What should the nurse do?", "options": ["Arrange an appropriate interpreter and reassess understanding using teach-back", "Ask a young family member to translate the full discussion", "Repeat the same wording more loudly", "Document that the client agreed because the client nodded"], "answer": "Arrange an appropriate interpreter and reassess understanding using teach-back", "why": "Interpretation and validation are needed when language affects meaning.", "id": 73}, {"week": "Week 11: Practicum Safety and Teaching", "topic": "Practicum safety", "q": "A student is asked to use equipment that has not been taught or demonstrated. What is the safest response?", "options": ["Explain the limitation and obtain supervision or instruction before proceeding", "Use the equipment slowly and ask for feedback afterward", "Ask another student to guide the procedure", "Refuse all future care involving the equipment"], "answer": "Explain the limitation and obtain supervision or instruction before proceeding", "why": "Students must recognize limits and obtain appropriate guidance.", "id": 74}, {"week": "Week 11: Practicum Safety and Teaching", "topic": "Code Green", "q": "An overhead announcement activates Code Green. What response should the student anticipate?", "options": ["Follow the site’s evacuation procedure and assigned role", "Begin the fire-extinguisher PASS sequence", "Search for a missing client", "Prepare for an external mass-casualty event"], "answer": "Follow the site’s evacuation procedure and assigned role", "why": "Code Green indicates evacuation; exact responsibilities vary by institution.", "id": 75}, {"week": "Week 11: Practicum Safety and Teaching", "topic": "Code Yellow", "q": "A Code Yellow is called. Which event should the student associate with this code?", "options": ["A missing person", "An evacuation", "A fire", "An external disaster"], "answer": "A missing person", "why": "The course identifies Code Yellow as a missing person.", "id": 76}, {"week": "Week 11: Practicum Safety and Teaching", "topic": "REACT", "q": "Smoke is seen coming from a wastebasket beside a client’s bed. According to REACT, what is the first action?", "options": ["Remove the client from immediate danger", "Try to extinguish the fire", "Call the client’s family", "Complete the occurrence report"], "answer": "Remove the client from immediate danger", "why": "REACT begins with Remove.", "id": 77}, {"week": "Week 11: Practicum Safety and Teaching", "topic": "PASS", "q": "After selecting the correct extinguisher and ensuring an exit route, which sequence should the nurse use?", "options": ["Pull the pin, aim at the base, squeeze the handle, and sweep", "Pull the pin, assess the smoke, stand back, and spray", "Protect the client, activate the alarm, shut the door, and sweep", "Press the alarm, aim high, squeeze, and stop"], "answer": "Pull the pin, aim at the base, squeeze the handle, and sweep", "why": "PASS is Pull, Aim, Squeeze, Sweep.", "id": 78}, {"week": "Week 11: Practicum Safety and Teaching", "topic": "Patient identification", "q": "Before administering medication, which identification method is safest?", "options": ["Use two approved identifiers and compare them with the medication record", "Confirm the room number and ask, “Are you Mr. Wong?”", "Ask a family member to identify the client", "Recognize the client from the previous shift"], "answer": "Use two approved identifiers and compare them with the medication record", "why": "Room number and recognition are not reliable identifiers.", "id": 79}, {"week": "Week 11: Practicum Safety and Teaching", "topic": "Teaching assessment", "q": "A nurse plans insulin teaching. What should be assessed before selecting teaching strategies?", "options": ["Readiness, prior knowledge, goals, language, cognition, vision, dexterity, and preferred learning methods", "Readiness, motivation, previous insulin experience, family support, and the amount of time available before discharge", "Cognitive ability, language needs, emotional state, available equipment, and the client’s preferred teaching format", "Current knowledge, physical ability, personal goals, cultural considerations, and barriers that may affect learning"], "answer": "Readiness, prior knowledge, goals, language, cognition, vision, dexterity, and preferred learning methods", "why": "Teaching begins with a learner-centred assessment.", "id": 80}, {"week": "Week 11: Practicum Safety and Teaching", "topic": "Teach-back", "q": "After explaining signs of hypoglycaemia, which question best uses teach-back?", "options": ["“To make sure I explained it clearly, tell me what signs you will watch for and what you will do.”", "“Using your own words, explain what hypoglycaemia might feel like and how you would respond.”", "“Show me how you would describe the warning signs to a family member and what action you would take.”", "“Tell me the steps you plan to follow if you notice shaking, sweating, or sudden weakness.”"], "answer": "“To make sure I explained it clearly, tell me what signs you will watch for and what you will do.”", "why": "Teach-back asks the client to explain information in their own words.", "id": 81}, {"week": "Week 11: Practicum Safety and Teaching", "topic": "Psychomotor evaluation", "q": "Which method best evaluates whether a client can safely use an inhaler?", "options": ["Ask the client to perform a return demonstration while the nurse observes", "Ask the client to describe each inhaler step while handling the device", "Observe the client use the inhaler, then ask the client to explain the purpose of each step", "Have the client demonstrate the technique and correct any errors before repeating the process"], "answer": "Ask the client to perform a return demonstration while the nurse observes", "why": "A skill is best evaluated through observed performance.", "id": 82}, {"week": "Week 12: Preparing for Practicum", "topic": "Practicum research", "q": "A student is assigned a client with heart failure and diabetes. Which preparation is most complete?", "options": ["Review primary and secondary diagnoses, expected signs and symptoms, treatments, medications, nursing care, and relevant terminology", "Review the primary diagnosis, current medications, abnormal laboratory results, and the scheduled nursing tasks", "Study each diagnosis, likely complications, prescribed therapies, and the assessments expected during the shift", "Prepare definitions of the diagnoses, common symptoms, treatment goals, and the client’s current plan of care"], "answer": "Review primary and secondary diagnoses, expected signs and symptoms, treatments, medications, nursing care, and relevant terminology", "why": "Practicum preparation requires broad, care-related research.", "id": 83}, {"week": "Week 12: Preparing for Practicum", "topic": "Worksheet purpose", "q": "Which statement best describes the nursing worksheet?", "options": ["It is a temporary organizational tool for collecting current information, planning care, documenting accurately, and giving report", "It is a working document used to organize client data, medication times, priorities, and changes during the shift", "It is a personal clinical tool that supports planning and report but does not replace the permanent health record", "It is a structured reference used to track assessments, interventions, and outstanding care throughout the shift"], "answer": "It is a temporary organizational tool for collecting current information, planning care, documenting accurately, and giving report", "why": "The worksheet supports organization but does not replace the legal record.", "id": 84}, {"week": "Week 12: Preparing for Practicum", "topic": "Updating the worksheet", "q": "Which information should be added during the shift?", "options": ["New vital signs, PRN medication and response, changes in condition, samples, teaching, and outstanding needs", "Updated assessments, care completed, consul let active = [];
let rendered = [];
let missedIds = [];

function shuffled(a) {
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function setupMenu(){
  const weeks=[...new Set(bank.map(q=>q.week))];
  const sel=document.getElementById('weekSelect');
  sel.innerHTML=weeks.map(w=>`<option value="${w}">${w}</option>`).join('');
}
function startSelected() {
  const w=document.getElementById('weekSelect').value;
  startTest(bank.filter(q=>q.week===w));
}
function startWhole() { startTest(bank); }
function startTest(list) {
  active=[...list];
  rendered=active.map(q=>({...q, displayOptions:shuffled(q.options), checked:false, selected:null}));
  missedIds=[];
  document.getElementById('start').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('testArea').style.display='block';
  renderQuestions();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderQuestions(){
  const host=document.getElementById('questions');
  let html='', lastWeek='';
  rendered.forEach((q,idx)=>{
    if(q.week!==lastWeek){html+=`<h2 class="week-heading">${q.week}</h2>`;lastWeek=q.week;}
    html+=`<article class="question" id="q-${q.id}">
      <div class="qnum">Question ${idx+1} of ${rendered.length} <span class="badge">${q.topic}</span></div>
      <div class="qtext">${q.q}</div>
      <div class="options">
      ${q.displayOptions.map((o,oi)=>`<label class="option" id="opt-${q.id}-${oi}">
        <input type="radio" name="q${q.id}" value="${encodeURIComponent(o)}" onchange="selectAnswer(${q.id}, decodeURIComponent(this.value))"> ${o}
      </label>`).join('')}
      </div>
      <div class="actions"><button class="primary" onclick="checkAnswer(${q.id})">Check Answer</button></div>
      <div class="rationale" id="rat-${q.id}"></div>
    </article>`;
  });
  host.innerHTML=html;
  updateProgress();
}
function selectAnswer(id,val){const q=rendered.find(x=>x.id===id);q.selected=val;updateProgress();}
function checkAnswer(id){
  const q=rendered.find(x=>x.id===id);
  if(!q.selected){alert('Please select an answer first.');return;}
  q.checked=true;
  q.displayOptions.forEach((o,oi)=>{
    const el=document.getElementById(`opt-${q.id}-${oi}`);
    el.classList.remove('correct','incorrect');
    if(o===q.answer) el.classList.add('correct');
    if(o===q.selected && o!==q.answer) el.classList.add('incorrect');
  });
  const rat=document.getElementById(`rat-${q.id}`);
  const ok=q.selected===q.answer;
  rat.innerHTML=`<strong>${ok?'Correct':'Incorrect'}.</strong> ${q.why}`;
  rat.style.display='block';
  updateProgress();
}
function updateProgress(){
  const answered=rendered.filter(q=>q.selected).length;
  const checked=rendered.filter(q=>q.checked).length;
  document.getElementById('progressText').textContent=`Answered ${answered}/${rendered.length} • Checked ${checked}/${rendered.length}`;
}
function finishTest(){
  const unanswered=rendered.filter(q=>!q.selected).length;
  if(unanswered && !confirm(`You have ${unanswered} unanswered question(s). Finish anyway?`)) return;
  const correct=rendered.filter(q=>q.selected===q.answer).length;
  missedIds=rendered.filter(q=>q.selected!==q.answer).map(q=>q.id);
  const pct=Math.round(correct/rendered.length*100);
  document.getElementById('scoreText').textContent=`${correct} / ${rendered.length} (${pct}%)`;
  document.getElementById('scoreMessage').textContent=pct>=85?'Strong performance. Review any missed rationales to close the remaining gaps.':pct>=70?'Good foundation. Focus first on the weaker topics below.':'Use the topic breakdown to target review, then complete the missed-question retest.';
  const groups={};
  rendered.forEach(q=>{ if(!groups[q.topic]) groups[q.topic]={c:0,n:0}; groups[q.topic].n++; if(q.selected===q.answer) groups[q.topic].c++; });
  document.getElementById('topicResults').innerHTML=Object.entries(groups).sort((a,b)=>(a[1].c/a[1].n)-(b[1].c/b[1].n)).map(([t,v])=>{
    const p=Math.round(v.c/v.n*100); return `<div class="topic-row"><span>${t}</span><strong>${v.c}/${v.n} (${p}%)</strong></div>`;
  }).join('');
  document.getElementById('retestBtn').disabled=missedIds.length===0;
  document.getElementById('testArea').style.display='none';
  document.getElementById('result').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function retestMissed(){
  const list=bank.filter(q=>missedIds.includes(q.id));
  startTest(list);
}
function resetCurrent(){if(confirm('Restart this section and clear all answers?')) startTest(active);}
function returnHome(){
  document.getElementById('testArea').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('start').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
setupMenu();
</script>
